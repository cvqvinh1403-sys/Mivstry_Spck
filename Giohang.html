<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIVSTRY - Giỏ Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dangnhapky.css">
    <link rel="stylesheet" href="Giohang.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="Trangchu.html">
                <h2 style="color: var(--primary-color); margin: 0;"><b>MIVSTRY</b></h2>
            </a>
            <a href="Trangchu.html" class="btn btn-outline-warning btn-sm">Tiếp tục khám phá</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4" style="color: var(--primary-color);">Giỏ hàng của bạn</h2>

        <div id="cart-content">
        </div>

        <div id="cart-summary" class="mt-4 p-4" style="background: var(--bg-card); border-radius: 10px; display: none;">
            <div class="d-flex justify-content-between align-items-center">
                <h5>Tổng cộng: <span id="total-items">0</span> phim</h5>
                <button class="btn btn-warning fw-bold px-5" onclick="checkout()">Thanh toán ngay</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, deleteDoc, doc } from './firebase-config.js';

        let cartData = [];

        async function loadCart() {
            const cartContent = document.getElementById('cart-content');
            const cartSummary = document.getElementById('cart-summary');

            cartContent.innerHTML = "<p class='text-center text-light'>Đang tải giỏ hàng...</p>";

            try {
                // Lấy danh sách phim trong collection "movieCart" từ Firestore
                const querySnapshot = await getDocs(collection(db, "movieCart"));
                cartData = [];
                querySnapshot.forEach((docSnap) => {
                    cartData.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (cartData.length === 0) {
                    cartContent.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart fa-4x mb-3"></i>
                        <h3>Giỏ hàng trống</h3>
                        <p>Bạn chưa thêm bộ phim nào vào danh sách.</p>
                    </div>
                `;
                    cartSummary.style.display = 'none';
                    return;
                }

                cartSummary.style.display = 'block';
                document.getElementById('total-items').innerText = cartData.length;

                cartContent.innerHTML = cartData.map((item) => `
                <div class="cart-item d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <img src="${item.poster || 'https://via.placeholder.com/80x120'}" class="cart-img me-3" alt="${item.title}">
                        <div>
                            <h5 class="mb-1">${item.title}</h5>
                            <small class="text-muted">Đã thêm vào: ${item.dateAdded || 'N/A'}</small>
                        </div>
                    </div>
                    <div class="btn-remove" data-id="${item.id}">
                        <i class="fas fa-trash-alt fa-lg"></i>
                    </div>
                </div>
            `).join('');

                // Gán sự kiện xóa cho từng nút xóa
                document.querySelectorAll('.btn-remove').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const docId = this.getAttribute('data-id');
                        removeFromCart(docId);
                    });
                });

            } catch (error) {
                console.error("Lỗi tải giỏ hàng:", error);
                cartContent.innerHTML = "<p class='text-center text-danger'>Không thể tải giỏ hàng.</p>";
            }
        }

        async function removeFromCart(docId) {
            if (confirm("Bạn muốn xóa phim này khỏi giỏ hàng?")) {
                try {
                    await deleteDoc(doc(db, "movieCart", docId));
                    loadCart();
                } catch (error) {
                    alert("Xóa thất bại: " + error.message);
                }
            }
        }

        window.checkout = function () {
            alert("Cảm ơn bạn! Tính năng thanh toán đang được phát triển.");
        }

        window.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>

</html>
